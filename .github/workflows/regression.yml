# Regression gate: the xc7 FASM cases from openXC7/demo-projects, run against
# the himbaechel xilinx uarch built from this tree.
#
# Why it exists: demo-projects/regression/ holds one case per fixed
# nextpnr-xilinx bug, each asserting a property of the produced FASM -- or of
# the routed netlist -- that a plausible packer or writer bug breaks while
# still exiting 0.  The legacy fork gates them from its own CI
# (nextpnr-xilinx/.github/workflows/demos.yml); the himbaechel uarch, which is
# where those fixes are being carried to, did not run them at all, so a defect
# could be reintroduced or left unported with every other job green.
#
# The suite is the porting work list: every case that fails here is a fix that
# exists in nextpnr-xilinx and has not arrived yet.  Cases whose fixes are
# still outstanding are listed as `known_unported` so that the gate is honest
# rather than either silent or permanently red -- a green run still proves the
# ported ones, and the outstanding ones stay named, with the reason.
#
# The binary is reached through the same CLI shim the demos use
# (.github/scripts/nextpnr-xilinx-shim.sh): regression/run.sh hard-codes the
# name `nextpnr-xilinx`, and the shim translates --chipdb/--xdc/--fasm into
# himbaechel's --device/-o xdc=/-o fasm=.  Chipdbs come from our own generator
# (gen/xilinx_gen.py), not from the fork's bbaexport.py.
name: regression

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The database the chipdbs are generated from, and the demo-projects commit
  # carrying the cases.  Fixed revisions, because the chipdb decides what the
  # cases do.
  PRJXRAY_DB_REV: a8fd3f462b6af16775babe5f938d257fc7e2a097
  DEMO_PROJECTS_REV: 0b1ed03a5757abf7086efd474adeff0b5cfc2ad8

jobs:
  regression:
    name: xc7 FASM regression cases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this tree
        uses: actions/checkout@v4
        with:
          path: nextpnr
          submodules: recursive

      - name: Check out prjxray-db
        uses: actions/checkout@v4
        with:
          repository: openXC7/prjxray-db
          ref: ${{ env.PRJXRAY_DB_REV }}
          path: prjxray-db

      - name: Check out demo-projects
        uses: actions/checkout@v4
        with:
          repository: openXC7/demo-projects
          ref: ${{ env.DEMO_PROJECTS_REV }}
          path: demo-projects

      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          # Mirrors the dependency set .github/workflows/arch_ci.yml installs
          # for its himbaechel build: without libboost-all-dev, configure fails
          # on Boost_INCLUDE_DIR/program_options/iostreams, and without
          # python3-dev the python bindings have no headers to build against.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y build-essential cmake ninja-build \
            libboost-all-dev python3-dev libeigen3-dev pkg-config yosys

      # xc7a35t is deliberately absent: the openXC7 prjxray-db has Artix-35T
      # part directories but no xc7a35t die directory, so the part is served by
      # the xc7a50t die it aliases to (docs/xilinx-porting/04-gap-assessment.md),
      # and the case's part.txt resolves to a chipdb we name for the part.
      - name: Configure
        run: |
          cmake -S nextpnr -B build -G Ninja \
            -DARCH=himbaechel -DHIMBAECHEL_UARCH=xilinx \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_PYTHON=ON \
            -DHIMBAECHEL_PRJXRAY_DB="$PWD/prjxray-db" \
            -DHIMBAECHEL_XILINX_DEVICES="xc7a50t;xc7a200t;xc7z010"

      - name: Build nextpnr-himbaechel and the chipdbs
        run: cmake --build build --target nextpnr-himbaechel -j"$(nproc)"

      - name: Assemble the chipdb directory and the shim
        run: |
          set -euo pipefail
          mkdir -p run/bin run/chipdb
          cd build/himbaechel/uarch/xilinx
          # Names regression/run.sh resolves from each case's part.txt.
          cp chipdb-xc7a200t.bin  ../../../../run/chipdb/xc7a200tfbg484.bin
          cp chipdb-xc7z010.bin   ../../../../run/chipdb/xc7z010clg400.bin
          cp chipdb-xc7a50t.bin   ../../../../run/chipdb/xc7a35tcsg324.bin
          cd ../../../../run
          install -m 755 ../nextpnr/.github/scripts/nextpnr-xilinx-shim.sh bin/nextpnr-xilinx
          ls -la bin chipdb

      - name: Run the ported cases (blocking)
        env:
          NEXTPNR_HIMBAECHEL_BIN: ${{ github.workspace }}/build/nextpnr-himbaechel
          CHIPDB_DIR: ${{ github.workspace }}/run/chipdb
        run: |
          set -euo pipefail
          # Prepend, rather than setting PATH in env: ${{ env.PATH }} is empty
          # there, which leaves the shim's own /usr/bin/env bash unfindable and
          # the step dying with exit 127 before any case runs.
          export PATH="$PWD/run/bin:$PATH"
          command -v nextpnr-xilinx
          # The last ten cases have their fix merged:
          # #66 (dsp-const-only-pins), #116 (pll-bufg-feedback,
          # odelay-plain-outbuf), #119 (bram-tdp-byte-enables), #124
          # (bram-output-register), #129 (dsp-autoreset-patdet), #130
          # (bram-output-register-clock), #132 (bufgmux) and #131 + #134
          # (ibufds-gte2-odiv2-bufgce, ibufds-gte2-shared-mgtclkout).
          demo-projects/regression/run.sh \
            clock-srcc-bufg bram-sdp-unused-port bufg-fabric-driven \
            config-primitive-startupe2 iddr-four-iff-flops \
            fdse-fdpe-undefined-init lutram-ram64x1s lutram-clkinv \
            lut_shared_pin const-holdout \
            srl-init xorigport-unknown-name srl-wemux dup-package-pin \
            bufio-in-use bufr-pad-site bufr-sink-region bufh-clock-constraint \
            pll-bufg-feedback odelay-plain-outbuf \
            bram-tdp-byte-enables bram-output-register bram-output-register-clock \
            dsp-autoreset-patdet bufgmux \
            ibufds-gte2-odiv2-bufgce ibufds-gte2-shared-mgtclkout \
            dsp-const-only-pins

      # Failing today, on purpose and by name.  These three cases are a gap of
      # this engine alone, with no counterpart in the fork; PR #56 is still open.
      # When one is fixed, move it into the blocking list above rather than
      # deleting the note.
      - name: Run the cases whose fixes are still outstanding (non-blocking)
        continue-on-error: true
        env:
          NEXTPNR_HIMBAECHEL_BIN: ${{ github.workspace }}/build/nextpnr-himbaechel
          CHIPDB_DIR: ${{ github.workspace }}/run/chipdb
        run: |
          set -uo pipefail
          export PATH="$PWD/run/bin:$PATH"
          # The three #56 cases are a gap of this engine, not of the port: RAM32X1S and
          # RAM32X2S are listed in dram_types with no packing branch, so all three stop
          # today with "no BELs remaining to implement cell type".  PR #56 adds the two
          # branches; the placement rule that lets several RAM32X1S share a SLICEM is the
          # patch posted on that PR (openXC7/nextpnr#56), on top of it.
          echo "lutram-ram32x1s #56: no packing branch for RAM32X1S (PR #56 open)"
          echo "lutram-ram32x2s #56: no packing branch for RAM32X2S (PR #56 open)"
          echo "lutram-ram32x1s-x4 #56: same gap today; the multi-cell placement is the patch posted on PR #56"
          demo-projects/regression/run.sh lutram-ram32x1s lutram-ram32x2s \
            lutram-ram32x1s-x4
